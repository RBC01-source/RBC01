<title>Maqueta SST Pymes Perú</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Concepto: hoja de obra en papel frío con acento naranja de chaleco de seguridad; un recorrido de 7 pasos que el cliente ve de punta a punta. */
:root {
  --bg: #f1f3f4;
  --surface: #ffffff;
  --ink: #1d272d;
  --muted: #5a6870;
  --line: #d5dbde;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --accent-soft: #fbe6dc;
  --ok: #2b8a3e;
  --ok-soft: #dff2e3;
  --warn: #b7791f;
  --warn-soft: #faedcf;
  --bad: #c92a2a;
  --bad-soft: #fadede;
  --f-display: 'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141b1f; --surface: #1c262b; --ink: #e8edef; --muted: #98a6ad; --line: #2f3c43;
    --accent: #ff8a4c; --accent-ink: #1a1008; --accent-soft: #3a2518;
    --ok: #6fcf86; --ok-soft: #1d3a26; --warn: #e8b94f; --warn-soft: #3b3014; --bad: #ff7b7b; --bad-soft: #432024;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141b1f; --surface: #1c262b; --ink: #e8edef; --muted: #98a6ad; --line: #2f3c43;
  --accent: #ff8a4c; --accent-ink: #1a1008; --accent-soft: #3a2518;
  --ok: #6fcf86; --ok-soft: #1d3a26; --warn: #e8b94f; --warn-soft: #3b3014; --bad: #ff7b7b; --bad-soft: #432024;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 28px; font-weight: 800; }
h2 { font-size: 24px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.demo { background: var(--accent-soft); color: var(--ink); border: 1px dashed var(--accent); padding: 8px 12px; font-size: 13px; }
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.steps button { flex: 0 0 auto; text-align: left; font: inherit; font-size: 13px; padding: 8px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); cursor: pointer; min-width: 112px; }
.steps button small { display: block; font-family: var(--f-mono); color: var(--muted); font-size: 11px; }
.steps button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps button[aria-current="true"] small { color: var(--bg); opacity: .75; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.plan { border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.plan.sel { border: 2px solid var(--accent); padding: 15px; }
.price { font-family: var(--f-display); font-size: 30px; font-weight: 800; }
.price small { font-family: var(--f-body); font-size: 13px; font-weight: 400; color: var(--muted); }
.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; padding: 10px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; }
input, select { font: inherit; padding: 9px 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); min-width: 0; width: 100%; }
.muted { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; font-weight: 500; letter-spacing: .04em; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mute { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.stat { border: 1px solid var(--line); padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 28px; line-height: 1.1; }
.bar { height: 10px; background: var(--bg); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--ok); }
.mail { border: 1px solid var(--line); background: var(--bg); }
.mail header { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; display: grid; gap: 2px; }
.mail .body { padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.mail ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.mail li { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.timebar { display: grid; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; }
.timebar input { padding: 0; accent-color: var(--accent); }
.semaforo { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--line); }
.dot { width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.note { border-left: 4px solid var(--line); padding-left: 12px; color: var(--muted); font-size: 13px; }
</style>

<div class="wrap">
  <div class="top">
    <h1>SST Pymes Perú</h1>
    <span class="tag">Maqueta del recorrido del cliente</span>
  </div>
  <p class="demo">Todo lo que ves usa datos de ejemplo. Nada se envía ni se cobra. Sirve para mostrar cómo vive un cliente el servicio, desde la oferta hasta el resumen semanal.</p>
  <nav class="steps" id="steps" aria-label="Pasos del recorrido"></nav>
  <div class="timebar" id="timebar" hidden>
    <label for="dia">Simular el paso del tiempo: <b class="mono" id="diaTxt">hoy</b></label>
    <input type="range" id="dia" min="0" max="120" value="0" step="1">
    <span class="muted">Mueve la barra para ver cómo se vencen las obligaciones y cómo cambia el semáforo.</span>
  </div>
  <main class="panel" id="view"></main>
</div>

<script>
(function () {
  var STEPS = [
    ['Oferta', 'Paso 1'], ['Alta', 'Paso 2'], ['Calendario', 'Paso 3'], ['Aviso por correo', 'Paso 4'],
    ['Panel del responsable', 'Paso 5'], ['Resumen semanal', 'Paso 6'], ['Cartera interna', 'Paso 7']
  ];
  var PLANES = [
    { id: 'basico', nombre: 'Básico', precio: 79, tope: 30, texto: 'Hasta 30 trabajadores', porque: 'Pagas lo mínimo porque tu empresa es chica: pocos puestos que evaluar, una sola persona a cargo y una sola sede.' },
    { id: 'pro', nombre: 'Pro', precio: 149, tope: 100, texto: 'Hasta 100 trabajadores', porque: 'Pagas más porque hay más puestos, más capacitaciones y varias personas que reparten el trabajo, incluso en más de un local.' },
    { id: 'plus', nombre: 'Plus', precio: 299, tope: 250, texto: 'Hasta 250 trabajadores', porque: 'Pagas más porque la carga es de varios equipos y sedes, gerencia necesita informes, y un especialista revisa tu avance cada trimestre.' }
  ];
  var COMPARA = [
    ['Trabajadores', 'Hasta 30', 'Hasta 100', 'Hasta 250'],
    ['Usuarios con acceso', '1', '3', '10'],
    ['Sedes o locales', '1', 'Hasta 3', 'Hasta 10'],
    ['Calendario anual y avisos por correo', 'Sí', 'Sí', 'Sí'],
    ['Avisos por WhatsApp', 'No', 'Sí', 'Sí'],
    ['Resumen semanal con semáforo', 'Al responsable', 'Al responsable y a gerencia', 'Al responsable, a gerencia y al comité'],
    ['Plantillas', 'Básicas: política, IPERC y programa anual', 'Las 10 familias completas', 'Las 10 familias, con tu logo y formato'],
    ['Evidencia guardada', '2 GB', '10 GB', '50 GB'],
    ['Apoyo', 'Correo, 48 horas', 'Correo y chat, 24 horas', 'Prioritario, más revisión trimestral con un especialista']
  ];
  var S = {
    paso: 0, dia: 0, suscrito: false, inicio: new Date(),
    empresa: 'Textiles Andina S.A.C.', ruc: '20123456789', trab: 45,
    responsable: 'Rosa Quispe', email: 'rosa@textilesandina.example', eventos: []
  };

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function plan() { for (var i = 0; i < PLANES.length; i++) { if (S.trab <= PLANES[i].tope) return PLANES[i]; } return null; }
  function fmt(off) {
    var d = new Date(S.inicio.getTime() + off * 86400000);
    return d.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'America/Lima' });
  }

  function generar() {
    var e = [], i, g = S.trab >= 20;
    function add(tipo, desc, off) { e.push({ id: e.length + 1, tipo: tipo, desc: desc, off: off, hecho: false, diaHecho: null }); }
    add('Programa anual', 'Aprobar el programa anual de SST', 7);
    if (g) add('Comité de SST', 'Constituir el comité y declararlo en el T-Registro', 14);
    else add('Supervisor de SST', 'Elegir al supervisor y declararlo en el T-Registro', 14);
    add('IPERC', 'Revisar la matriz IPERC con los riesgos de cada puesto', 25);
    var insp = [20, 110, 200, 290], cap = [45, 135, 225, 315];
    for (i = 0; i < 4; i++) add('Inspección interna', 'Inspección interna ' + (i + 1) + ' de 4, con registro', insp[i]);
    for (i = 0; i < 4; i++) add('Capacitación', 'Capacitación ' + (i + 1) + ' de 4, con registro de asistencia', cap[i]);
    add('Simulacro', 'Simulacro de emergencia 1 de 2, con informe', 90);
    add('Simulacro', 'Simulacro de emergencia 2 de 2, con informe', 270);
    add('Examen médico', 'Exámenes médicos ocupacionales del personal', 60);
    if (g) for (i = 1; i <= 12; i++) add('Comité de SST', 'Reunión ordinaria del comité ' + i + ' de 12, con acta', 30 * i);
    add('Evaluación anual', 'Evaluar el cumplimiento del programa anual', 350);
    e.sort(function (a, b) { return a.off - b.off; });
    for (i = 0; i < e.length; i++) e[i].id = i + 1;
    S.eventos = e;
  }
  generar();

  function due(ev) { return ev.off - S.dia; }
  function calc() {
    var base = 0, hechos = 0, venc = [], prox = [], sem = 0, i, ev, d;
    for (i = 0; i < S.eventos.length; i++) {
      ev = S.eventos[i]; d = due(ev);
      if (d < 0) { base++; if (ev.hecho) hechos++; else venc.push(ev); }
      else if (!ev.hecho && d <= 14) prox.push(ev);
      if (ev.hecho && ev.diaHecho !== null && ev.diaHecho >= S.dia - 7) sem++;
    }
    var cum = base === 0 ? 100 : Math.round(100 * hechos / base);
    var color = (cum < 70 || venc.length >= 3) ? 'bad' : ((venc.length >= 1 || cum < 90) ? 'warn' : 'ok');
    return { base: base, hechos: hechos, venc: venc, prox: prox, sem: sem, cum: cum, color: color,
      nombre: { bad: 'ROJO', warn: 'AMARILLO', ok: 'VERDE' }[color] };
  }
  function cuando(ev) {
    var d = due(ev);
    if (d < 0) return '<span class="pill bad">VENCIDO hace ' + (-d) + ' d</span>';
    if (d === 0) return '<span class="pill warn">HOY</span>';
    return '<span class="pill mute">en ' + d + ' d</span>';
  }

  /* ---------- vistas ---------- */
  function vOferta() {
    var h = '<div><span class="tag">Lo que ve el dueño de la pyme</span></div>' +
      '<h2>Cumple con SUNAFIL sin perseguir papeles</h2>' +
      '<p>Te armamos el calendario anual de obligaciones de seguridad y salud en el trabajo, te avisamos antes de cada vencimiento y cada lunes te decimos cómo vas, con un semáforo.</p>' +
      '<div class="grid">';
    for (var i = 0; i < PLANES.length; i++) {
      var p = PLANES[i];
      h += '<div class="plan"><h3>' + p.nombre + '</h3><div class="price">S/ ' + p.precio + ' <small>al mes</small></div><p class="muted">' + p.texto + '</p>' +
        '<p><b>Por qué este precio.</b> ' + p.porque + '</p></div>';
    }
    h += '</div><h3>Qué cambia entre un plan y otro</h3><div class="tablebox"><table><thead><tr><th></th><th>Básico</th><th>Pro</th><th>Plus</th></tr></thead><tbody>';
    for (var r = 0; r < COMPARA.length; r++) {
      h += '<tr><th scope="row" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:14px;color:var(--ink);font-weight:600">' + COMPARA[r][0] + '</th><td>' + COMPARA[r][1] + '</td><td>' + COMPARA[r][2] + '</td><td>' + COMPARA[r][3] + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += '<p class="note">Precios de partida: son una hipótesis por validar con los primeros clientes. El WhatsApp y la revisión con especialista dependen de conectar la API de WhatsApp y de contar con el especialista. Lo que cambia de un plan a otro es la carga de trabajo (personas, sedes, evidencia) y el acompañamiento, no la obligación legal: todos cumplen lo que exige la ley para su tamaño. Una multa de SUNAFIL por incumplir SST puede costar más que un año de suscripción.</p>' +
      '<div class="nav"><span></span><button class="btn" data-go="1">Quiero suscribirme</button></div>';
    return h;
  }

  function vAlta() {
    var p = plan();
    var h = '<div><span class="tag">Datos que pide el alta</span></div><h2>Cuéntanos de tu empresa</h2>' +
      '<form id="f" autocomplete="off">' +
      '<label for="fe">Razón social<input id="fe" value="' + esc(S.empresa) + '"></label>' +
      '<label for="fr">RUC<input id="fr" value="' + esc(S.ruc) + '" inputmode="numeric" maxlength="11"></label>' +
      '<label for="ft">Número de trabajadores<input id="ft" type="number" min="1" max="250" value="' + S.trab + '"></label>' +
      '<label for="fn">Responsable de SST<input id="fn" value="' + esc(S.responsable) + '"></label>' +
      '<label for="fm">Correo del responsable<input id="fm" type="email" value="' + esc(S.email) + '"></label>' +
      '</form>';
    h += '<div class="stat"><span class="muted">Plan que te corresponde</span><b id="planTxt">' + (p ? p.nombre + ' - S/ ' + p.precio + ' al mes' : 'Más de 250 trabajadores: plan a medida') + '</b>' +
      '<span class="muted" id="calTxt">' + (S.trab >= 20 ? 'Con 20 o más trabajadores la ley exige comité de SST: tu calendario tendrá 27 obligaciones.' : 'Con menos de 20 trabajadores se elige un supervisor de SST: tu calendario tendrá 15 obligaciones.') + '</span></div>';
    h += '<div class="row"><button class="btn" id="pagar">' + (S.suscrito ? 'Suscripción activa' : 'Confirmar suscripción (pago simulado)') + '</button>' +
      '<span class="muted">En la versión real aquí se cobra con Yape, transferencia o tarjeta.</span></div>';
    h += '<div class="nav"><button class="btn ghost" data-go="0">Atrás</button><button class="btn" data-go="2" ' + (S.suscrito ? '' : 'disabled') + '>Ver mi calendario</button></div>';
    return h;
  }

  function vCalendario() {
    var h = '<div><span class="tag">Lo que genera el flujo de alta</span></div><h2>' + esc(S.empresa) + ': ' + S.eventos.length + ' obligaciones en el año</h2>' +
      '<p class="muted">Se crean solas al confirmar la suscripción, con fecha y responsable. Ya no hay que acordarse de nada.</p>' +
      '<div class="tablebox"><table><thead><tr><th class="n">N°</th><th>Fecha</th><th>Tipo</th><th>Qué hay que hacer</th></tr></thead><tbody>';
    for (var i = 0; i < S.eventos.length; i++) {
      var e = S.eventos[i];
      h += '<tr><td class="n mono">' + e.id + '</td><td class="mono">' + fmt(e.off) + '</td><td>' + esc(e.tipo) + '</td><td>' + esc(e.desc) + '</td></tr>';
    }
    h += '</tbody></table></div><div class="nav"><button class="btn ghost" data-go="1">Atrás</button><button class="btn" data-go="3">Ver un aviso por correo</button></div>';
    return h;
  }

  function vCorreo() {
    var items = [], i, d;
    for (i = 0; i < S.eventos.length; i++) { d = due(S.eventos[i]); if (!S.eventos[i].hecho && d <= 30) items.push(S.eventos[i]); }
    var venc = 0; for (i = 0; i < items.length; i++) if (due(items[i]) < 0) venc++;
    var h = '<div><span class="tag">Lo que hace el flujo diario de las 8:00</span></div><h2>Aviso por correo</h2>';
    if (!items.length) {
      h += '<p>Hoy no hay vencimientos en los próximos 30 días. Mueve la barra del tiempo para ver cómo llegan los avisos.</p>';
    } else {
      h += '<div class="mail"><header><span><b>Para:</b> ' + esc(S.email) + '</span></header>' +
        '<header><span><b>Asunto:</b> ' + (venc ? 'URGENTE: ' : '') + items.length + ' vencimiento(s) de SST - ' + esc(S.empresa) + '</span></header>' +
        '<div class="body"><p>Hola ' + esc(S.responsable) + ', estos vencimientos de seguridad y salud en el trabajo requieren su atención:</p><ul>';
      for (i = 0; i < items.length; i++) {
        h += '<li><span><b>' + esc(items[i].tipo) + '</b>: ' + esc(items[i].desc) + ' - vence ' + fmt(items[i].off) + '</span><span class="row">' + cuando(items[i]) +
          '<button class="btn sm" data-done="' + items[i].id + '">Completar con evidencia</button></span></li>';
      }
      h += '</ul><p class="muted">Registre la evidencia en la plataforma para marcar cada obligación como completada.</p></div></div>';
    }
    h += '<p class="note">El aviso sale a los 30, 15, 7, 1 y 0 días, y una vez al vencer. El enlace "Completar con evidencia" abre un formulario donde se sube el archivo; al enviarlo, la obligación queda completada. Los planes Pro y Plus reciben además el aviso por WhatsApp.</p>' +
      '<div class="nav"><button class="btn ghost" data-go="2">Atrás</button><button class="btn" data-go="4">Ir al panel</button></div>';
    return h;
  }

  function vPanel() {
    var c = calc(), tot = S.eventos.length, hechas = 0, i, pend = [];
    for (i = 0; i < tot; i++) { if (S.eventos[i].hecho) hechas++; else pend.push(S.eventos[i]); }
    var h = '<div><span class="tag">Lo que ve el responsable al entrar</span></div><h2>Mi panel de SST</h2>' +
      '<div class="stats"><div class="stat"><span class="muted">Obligaciones del año</span><b>' + hechas + ' / ' + tot + '</b></div>' +
      '<div class="stat"><span class="muted">Vencidas</span><b>' + c.venc.length + '</b></div>' +
      '<div class="stat"><span class="muted">Próximos 14 días</span><b>' + c.prox.length + '</b></div></div>' +
      '<div class="bar" role="img" aria-label="Avance del año"><i style="width:' + Math.round(100 * hechas / tot) + '%"></i></div>' +
      '<h3>Pendientes, de la más cercana a la más lejana</h3><div class="tablebox"><table><thead><tr><th>Fecha</th><th>Qué hay que hacer</th><th>Estado</th><th></th></tr></thead><tbody>';
    for (i = 0; i < Math.min(pend.length, 12); i++) {
      h += '<tr><td class="mono">' + fmt(pend[i].off) + '</td><td>' + esc(pend[i].desc) + '</td><td>' + cuando(pend[i]) + '</td>' +
        '<td><button class="btn sm" data-done="' + pend[i].id + '">Subir evidencia y completar</button></td></tr>';
    }
    h += '</tbody></table></div>';
    if (pend.length > 12) h += '<p class="muted">Y ' + (pend.length - 12) + ' obligaciones más adelante en el año.</p>';
    h += '<p class="note">La subida de evidencia está simulada. En la versión real se guardaría el archivo (acta, registro de asistencia, informe) y quedaría como prueba ante una inspección.</p>' +
      '<div class="nav"><button class="btn ghost" data-go="3">Atrás</button><button class="btn" data-go="5">Ver el resumen semanal</button></div>';
    return h;
  }

  function vResumen() {
    var c = calc(), i, h;
    h = '<div><span class="tag">Lo que llega cada lunes a las 8:00</span></div><h2>Resumen semanal de SST</h2>' +
      '<div class="semaforo"><span class="dot ' + c.color + '"></span><div><b style="font-family:var(--f-display);font-size:22px">' + c.nombre + ' - ' + c.cum + '% de cumplimiento</b>' +
      '<div class="muted">' + c.hechos + ' de ' + c.base + ' obligaciones con fecha cumplida tienen evidencia. Completadas esta semana: ' + c.sem + '.</div></div></div>';
    h += '<h3>Vencidas sin evidencia (' + c.venc.length + ')</h3>';
    if (c.venc.length) {
      h += '<ul>'; for (i = 0; i < c.venc.length; i++) h += '<li><b>' + esc(c.venc[i].tipo) + '</b>: ' + esc(c.venc[i].desc) + ' - venció ' + fmt(c.venc[i].off) + ' (hace ' + (-due(c.venc[i])) + ' días)</li>'; h += '</ul>';
    } else h += '<p>No tiene obligaciones vencidas. Muy bien.</p>';
    h += '<h3>Próximos 14 días (' + c.prox.length + ')</h3>';
    if (c.prox.length) {
      h += '<ul>'; for (i = 0; i < c.prox.length; i++) h += '<li><b>' + esc(c.prox[i].tipo) + '</b>: ' + esc(c.prox[i].desc) + ' - vence ' + fmt(c.prox[i].off) + ' (en ' + due(c.prox[i]) + ' días)</li>'; h += '</ul>';
    } else h += '<p>No hay vencimientos en los próximos 14 días.</p>';
    h += '<p class="note">Rojo: cumplimiento menor a 70% o 3 o más vencidas. Amarillo: al menos una vencida o menos de 90%. Verde: el resto. Son umbrales de partida, no una norma de SUNAFIL.</p>' +
      '<div class="nav"><button class="btn ghost" data-go="4">Atrás</button><button class="btn" data-go="6">Ver la cartera (equipo interno)</button></div>';
    return h;
  }

  function vCartera() {
    var c = calc();
    var filas = [
      { n: S.empresa + ' (la que acabas de crear)', c: c.cum, v: c.venc.length, p: c.prox.length, k: c.color, nom: c.nombre },
      { n: 'Empresa Demo Logística S.A.C.', c: 50, v: 2, p: 1, k: 'bad', nom: 'ROJO' },
      { n: 'Empresa Demo Metalmecánica S.A.C.', c: 100, v: 0, p: 1, k: 'ok', nom: 'VERDE' }
    ];
    var o = { bad: 0, warn: 1, ok: 2 };
    filas.sort(function (a, b) { return (o[a.k] - o[b.k]) || (a.c - b.c); });
    var r = 0, a = 0, g = 0, i;
    for (i = 0; i < filas.length; i++) { if (filas[i].k === 'bad') r++; else if (filas[i].k === 'warn') a++; else g++; }
    var h = '<div><span class="tag">Lo que ve tu equipo, no el cliente</span></div><h2>Cartera SST: ' + r + ' en rojo, ' + a + ' en amarillo, ' + g + ' en verde</h2>' +
      '<p class="muted">Se ordena con los rojos primero. Así sabes a quién llamar el lunes antes de que la multa llegue.</p>' +
      '<div class="tablebox"><table><thead><tr><th>Estado</th><th>Empresa</th><th class="n">Cumplimiento</th><th class="n">Vencidas</th><th class="n">Próximas</th></tr></thead><tbody>';
    for (i = 0; i < filas.length; i++) {
      h += '<tr><td><span class="pill ' + filas[i].k + '">' + filas[i].nom + '</span></td><td>' + esc(filas[i].n) + '</td><td class="n">' + filas[i].c + '%</td><td class="n">' + filas[i].v + '</td><td class="n">' + filas[i].p + '</td></tr>';
    }
    h += '</tbody></table></div><p class="note">Las dos empresas Demo son las de la prueba del flujo en n8n. Tu empresa nueva cambia sola con lo que hagas en el panel y con el tiempo simulado.</p>' +
      '<div class="nav"><button class="btn ghost" data-go="5">Atrás</button><button class="btn ghost" data-go="0">Volver al inicio</button></div>';
    return h;
  }

  var VISTAS = [vOferta, vAlta, vCalendario, vCorreo, vPanel, vResumen, vCartera];

  function renderSteps() {
    var h = '';
    for (var i = 0; i < STEPS.length; i++) {
      h += '<button data-go="' + i + '" aria-current="' + (i === S.paso) + '"' + (i > 1 && !S.suscrito ? ' disabled' : '') + '>' + STEPS[i][0] + '<small>' + STEPS[i][1] + '</small></button>';
    }
    document.getElementById('steps').innerHTML = h;
  }
  function render() {
    renderSteps();
    document.getElementById('timebar').hidden = S.paso < 3;
    document.getElementById('view').innerHTML = VISTAS[S.paso]();
    document.getElementById('diaTxt').textContent = S.dia === 0 ? 'hoy' : 'dentro de ' + S.dia + ' días (' + fmt(S.dia) + ')';
  }

  function leerForm() {
    var g = function (id) { return document.getElementById(id); };
    if (!g('f')) return;
    S.empresa = g('fe').value || 'Mi empresa'; S.ruc = g('fr').value; S.responsable = g('fn').value || 'Responsable'; S.email = g('fm').value;
    S.trab = Math.max(1, parseInt(g('ft').value, 10) || 1);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-go')) { leerForm(); S.paso = parseInt(t.getAttribute('data-go'), 10); render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-done')) {
      var id = parseInt(t.getAttribute('data-done'), 10);
      for (var i = 0; i < S.eventos.length; i++) if (S.eventos[i].id === id) { S.eventos[i].hecho = true; S.eventos[i].diaHecho = S.dia; }
      render(); return;
    }
    if (t.id === 'pagar') {
      leerForm(); if (!plan()) return;
      generar(); S.suscrito = true; S.dia = 0; document.getElementById('dia').value = 0; render();
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'dia') { S.dia = parseInt(ev.target.value, 10); render(); return; }
    if (ev.target.id === 'ft') {
      leerForm(); var p = plan();
      document.getElementById('planTxt').textContent = p ? p.nombre + ' - S/ ' + p.precio + ' al mes' : 'Más de 250 trabajadores: plan a medida';
      document.getElementById('calTxt').textContent = S.trab >= 20 ? 'Con 20 o más trabajadores la ley exige comité de SST: tu calendario tendrá 27 obligaciones.' : 'Con menos de 20 trabajadores se elige un supervisor de SST: tu calendario tendrá 15 obligaciones.';
      if (S.suscrito) { S.suscrito = false; document.getElementById('pagar').textContent = 'Confirmar suscripción (pago simulado)'; document.querySelector('.nav [data-go="2"]').disabled = true; }
    }
  });
  render();
})();
</script>
